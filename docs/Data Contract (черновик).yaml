# ============================================================
# Data Contract: витрина складских операций ЕГАИС
# Формат — в духе datacontract.com.
# Провайдер   = команда загрузки (ETL/DWH) контура приёмки ЕГАИС.
# Потребители = управление контроля рынка (сверка деклараций), отраслевая
#               статистика, процедуры контрольных мероприятий.
# Контракт фиксирует обязательства ЗАГРУЗКИ перед контуром контроля:
# что витрина обязана в точности воспроизводить принятый от организаций поток.
# ============================================================

dataContractSpecification: 1.1.0
id: dc-warehouse-operations-alko
info:
  title: Витрина складских операций ЕГАИС (приёмка list_doc → витрина doc_oper)
  version: 1.0.0
  description: >
    Контракт на витрину складских операций алкогольной продукции, формируемую из
    сырого слоя приёмки ЕГАИС (list_doc). На витрине строятся сверка деклараций,
    отраслевая статистика оборота и основания для контрольных мероприятий, поэтому
    расхождение витрины с принятым потоком недопустимо: операция должна дойти до
    контроля ровно в том виде, в каком организация её передала.
  owner: команда загрузки (ETL/DWH)
  contact:
    name: Data Quality / контур приёмки ЕГАИС
    role: data-owner

servers:
  source:
    type: postgres
    host: <хост БД контура приёмки>
    database: Project_DQ
    schema: public
    description: Сырой слой приёмки — операции, принятые от организаций «как пришли»
  warehouse:
    type: postgres
    host: <хост БД контура приёмки>
    database: Project_DQ
    schema: public
    description: Витрина контроля, потребляемая сверкой деклараций и отраслевой статистикой

terms:
  usage: >
    doc_oper — единственный разрешённый источник для сверки деклараций, отраслевой
    статистики оборота и материалов контрольных мероприятий. list_doc — технический
    слой приёмки: прямое чтение потребителями не предполагается, он используется как
    эталон для сверки и для восстановления данных при дефекте загрузки.
  limitations: >
    Контракт не покрывает bottling_date и wbpid — эти атрибуты присутствуют в source-схеме,
    но не переносятся ETL в doc_oper (известный разрыв, см. Профилирование и метрики качества.md, шаг 2).
  billing: internal
  noticePeriod: P30D   # изменения контракта согласуются за 30 дней до внедрения

models:
  doc_oper:
    description: Витрина складских операций в DWH
    type: table
    fields:
      id:
        type: bigint
        required: true
        unique: true
        description: Business key операции (= list_doc.sid в источнике)
      org_id:
        type: varchar(50)
        required: true
        pattern: "^0\\d{7}$"
        description: >
          Код организации в реестре лицензиатов: ровно 8 цифр, ведущий ноль ЗНАЧАЩИЙ.
          Хранение и передача только строкой: любое числовое приведение уничтожает
          ведущий ноль и делает операцию несопоставимой с реестром.
        quality:
          - type: sql
            description: Доля org_id, совпадающих с принятым client_id (DQ-04)
            query: |
              SELECT round(100.0 * count(*) FILTER (WHERE d.org_id = l.client_id) / count(*), 2)
              FROM doc_oper d JOIN list_doc l ON l.sid = d.id
            mustBeGreaterOrEqualThan: 99
      operation:
        type: varchar(20)
        required: true
      date_operation:
        type: timestamp
        required: true
        description: Дата фактической складской операции (не дата загрузки)
      type_doc:
        type: varchar(20)
        required: true
        enum: ["chek", "spis"]
      cod_alco:
        type: bigint
        required: true
        description: Код алкогольной продукции
      qua:
        type: "numeric(18,3)"
        required: true
        description: Количество со знаком (chek > 0, spis < 0)
      doc_2:
        type: varchar(50)
        required: true
        unique: false        # ЯВНО: номер справки Б повторяется, это не ключ
        pattern: "^2_\\d{10}$"
        description: >
          Номер справки Б — документа конкретного перемещения партии между участниками рынка.
          Повторяется во всех операциях этого перемещения (в среднем 5). Принадлежит ровно
          одной справке А: нарушение этой связи означает пересортицу партий.
      doc_1:
        type: varchar(50)
        required: true
        unique: false        # ЯВНО: номер справки А повторяется, это не ключ
        pattern: "^1_\\d{10}$"
        description: >
          Номер справки А — документа партии, сопровождающего продукцию от производства или
          импорта до конечной продажи. Повторяется во всех операциях партии (в среднем 100).
          В рамках одной справки А код продукции обязан быть один.

    quality:
      - type: sql
        description: Полнота загрузки — доля принятых операций, дошедших до витрины (DQ-02)
        query: |
          SELECT round(100.0 * (SELECT count(*) FROM doc_oper) / (SELECT count(*) FROM list_doc), 2)
        mustBeGreaterOrEqualThan: 99
      - type: sql
        description: >
          Баланс перемещения (DQ-14): по справке Б нельзя списать больше, чем получено,
          поэтому сумма количеств в разрезе (org_id, doc_2) не может быть отрицательной.
          Значение больше нуля означает, что операции пары потеряны при загрузке или
          разъехались по разным кодам организации.
        query: |
          SELECT count(*) FROM (
            SELECT org_id, doc_2 FROM doc_oper GROUP BY org_id, doc_2 HAVING sum(qua) < 0
          ) x
        mustBe: 0
      - type: sql
        description: >
          Иерархия документов (DQ-12): справка Б принадлежит ровно одной справке А.
          Ненулевое значение = перемещение приписано двум разным партиям.
        query: |
          SELECT count(*) FROM (
            SELECT doc_2 FROM doc_oper GROUP BY doc_2 HAVING count(DISTINCT doc_1) > 1
          ) x
        mustBe: 0
      - type: sql
        description: >
          Однородность партии (DQ-13): в рамках одной справки А один код продукции.
        query: |
          SELECT count(*) FROM (
            SELECT doc_1 FROM doc_oper GROUP BY doc_1 HAVING count(DISTINCT cod_alco) > 1
          ) x
        mustBe: 0
      - type: sql
        description: >
          Целостность происхождения (DQ-11): в витрине не должно быть строк, которых не
          было в принятом потоке. Ненулевое значение = запись попала в контур контроля
          в обход приёмки.
        query: |
          SELECT count(*) FROM doc_oper d
          LEFT JOIN list_doc l ON l.sid = d.id
          WHERE l.sid IS NULL
        mustBe: 0

servicelevels:
  freshness:
    description: Данные за операционный день должны быть загружены к началу следующего рабочего дня
    threshold: PT24H
    column: date_operation
  frequency:
    description: Загрузка выполняется ежедневно, ETL + DQ-пайплайн — по расписанию в 06:00 UTC
    cron: "0 6 * * *"
  availability:
    description: Витрина доступна потребителям 24/7, за исключением окна загрузки 05:30–06:15 UTC
  support:
    description: >
      Инциденты по критичным правилам (DQ-02/03/04/11/14) — реакция в течение 1 часа в
      рабочее время; до устранения витрина не допускается в контур контроля.
    responseTime: PT1H
  traceability:
    description: >
      ТРЕБОВАНИЕ, НЕ ВЫПОЛНЯЕТСЯ СЕЙЧАС (см. Шаг 6): изменения витрины должны
      журналироваться (кто, когда, каким процессом, сколько строк). Инцидент
      INC-2026-08-22-01 показал цену этого пробела: факт ручной довставки данных
      восстановлен по косвенным уликам, но автор, время и санкционированность
      операции по данным не определяются.
    status: gap
  no_manual_writes:
    description: >
      ТРЕБОВАНИЕ, НЕ ОБЕСПЕЧЕНО ТЕХНИЧЕСКИ: запись в витрину выполняет только
      регламентный процесс загрузки. Ручные вставки и правки запрещены, включая
      восстановление потерянных данных: именно такая довставка исказила коды
      организаций. Права на запись должны быть у сервисной учётной записи ETL.
    status: gap

# Ссылка на исполняемые проверки — реестр правил и их реализация
qualityChecksRef:
  registry: ../docs/Реестр правил и метрик.md
  sql: ../sql/02_dq_rules.sql
  soda: ../checks/checks.yml
